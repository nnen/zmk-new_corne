manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: englmaxi
      url-base: https://github.com/englmaxi
    - name: gpeye
      url-base: https://github.com/GPeye
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml
    # Status screen for the dongle's 128x64 OLED (shield: dongle_display)
    - name: zmk-dongle-display
      remote: englmaxi
      revision: v0.3
    # nice!view slideshow screen for the peripherals (shield: nice_view_custom)
    - name: hammerbeam-slideshow
      remote: gpeye
      revision: main
  self:
    path: config
